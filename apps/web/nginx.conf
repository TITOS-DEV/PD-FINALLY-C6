server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real (por ejemplo
    # /login, o recargar la página estando en /) tiene que devolver
    # index.html para que el Router de Angular sea quien decida qué mostrar
    # — si no, nginx respondería 404 al recargar cualquier ruta que no sea "/".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css) son
    # inmutables: si cambia el contenido, cambia el nombre. Podemos
    # cachearlos agresivamente sin miedo a servir una versión vieja.
    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
