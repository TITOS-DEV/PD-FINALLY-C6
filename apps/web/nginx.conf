server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route that is not a static file (e.g. /login or reloading at /)
    # returns index.html so Angular's Router handles navigation — otherwise
    # nginx would respond 404 on page reload for non-root paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset files (main-XXXX.js, styles-XXXX.css) are immutable.
    # Cache aggressively without risk of serving stale assets.
    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
